# Builds and pushes the Nabux Postiz image. Does not deploy to any server.
name: Nabux image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version baked into the tag nabux-<version> (example: v2.25.3)'
        required: true
        type: string
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image tag
        id: tag
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          # A tag that already starts with nabux- is not prefixed twice.
          VER="${RAW#nabux-}"
          if [ -z "$VER" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/nabuxai/postiz-app:nabux-${VER}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          NEXT_PUBLIC_VERSION: nabux-${{ steps.tag.outputs.version }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_VERSION="$NEXT_PUBLIC_VERSION" \
            --pull \
            --provenance=false --sbom=false \
            --output "type=registry,name=$IMAGE" .
